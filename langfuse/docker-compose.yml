# Local-only Langfuse. UI: http://127.0.0.1:3100
# Start: docker compose -f langfuse/docker-compose.yml up -d
# Nothing here talks to cloud.langfuse.com. TELEMETRY_ENABLED=false.
services:
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on: &depends
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - 127.0.0.1:3030:3030
    environment: &langfuse-env
      NEXTAUTH_URL: http://127.0.0.1:3100
      TELEMETRY_ENABLED: "false"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      SALT: localsalt
      ENCRYPTION_KEY: 82dd409bcf06ac8a6aec18b53a1089f9f696a523adc7f88ae0cf69d5f94ec4b0
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: localredis

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:3
    restart: unless-stopped
    depends_on: *depends
    ports:
      - 127.0.0.1:3100:3000
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: localsecret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://127.0.0.1:9090
      LANGFUSE_INIT_ORG_ID: stockpicker
      LANGFUSE_INIT_ORG_NAME: stockpicker
      LANGFUSE_INIT_PROJECT_ID: news-judge
      LANGFUSE_INIT_PROJECT_NAME: news-judge
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-local-stockpicker
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-local-stockpicker
      LANGFUSE_INIT_USER_EMAIL: local@example.com
      LANGFUSE_INIT_USER_NAME: local
      LANGFUSE_INIT_USER_PASSWORD: local-only

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
    ports:
      - 127.0.0.1:8123:8123
      - 127.0.0.1:9000:9000
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - 127.0.0.1:9090:9000
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/redis:7
    restart: unless-stopped
    command: --requirepass localredis --maxmemory-policy noeviction
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10

  postgres:
    image: docker.io/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - 127.0.0.1:5433:5432
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_minio_data:
